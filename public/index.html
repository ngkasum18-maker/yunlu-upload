<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>雲路 Yunlu — 上載相片</title>
    <meta name="description" content="雲路相片上載——輕鬆拖放，即刻保存。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+TC:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="topbar">
      <a class="logo" href="/">雲路 <span>Yunlu</span></a>
    </header>

    <main>
      <section class="hero" aria-labelledby="brand-title">
        <div class="hero-copy">
          <h1 id="brand-title" class="brand">雲路</h1>
          <p class="tagline">把畫面留低。拖放相片，即刻上載。</p>
        </div>

        <form id="upload-form" class="dropzone" aria-label="上載相片">
          <input
            id="file-input"
            type="file"
            name="photos"
            accept="image/*"
            multiple
            hidden
          />
          <div class="dropzone-inner">
            <p class="dropzone-title">拖放相片到呢度</p>
            <p class="dropzone-hint">或者撳下面掣由相簿揀</p>
            <button type="button" class="cta" id="pick-btn">揀相片</button>
          </div>
          <div class="progress" id="progress" hidden>
            <div class="progress-bar" id="progress-bar"></div>
            <p class="progress-label" id="progress-label">上載緊…</p>
          </div>
        </form>

        <p class="status" id="status" role="status" aria-live="polite"></p>
      </section>

      <section class="gallery-section" aria-labelledby="gallery-title">
        <div class="section-head">
          <h2 id="gallery-title">你嘅相冊</h2>
          <p class="section-sub">剛上載嘅相會出現喺呢度</p>
        </div>
        <div id="gallery" class="gallery"></div>
        <p id="empty" class="empty" hidden>暫時未有相片。試下上載第一張。</p>
      </section>
    </main>

    <dialog id="lightbox" class="lightbox">
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="關閉">
        關閉
      </button>
      <img id="lightbox-img" alt="" />
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
