<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>填寫上載資料 — 雲路補習社</title>
    <meta name="theme-color" content="#1f6b4f" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/tutor.css" />
  </head>
  <body class="admin-page">
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="topbar">
      <a class="logo" href="/tutor.html">雲路補習社 <span>Tutorial Centre</span></a>
      <nav class="nav">
        <a href="/tutor.html">返回網站</a>
      </nav>
    </header>

    <main>
      <section class="section admin-panel admin-panel-top" id="admin">
        <h2 class="section-title">填寫上載資料</h2>
        <p class="admin-lead">選擇分頁，填寫後按儲存。資料會即時顯示喺補習社網站。</p>

        <div class="admin-tabs">
          <button class="admin-tab is-active" data-tab="about-admin">關於我哋</button>
          <button class="admin-tab" data-tab="courses-admin">課程管理</button>
          <button class="admin-tab" data-tab="announce-admin">公告管理</button>
          <button class="admin-tab" data-tab="info-admin">基本資料</button>
        </div>

        <div class="admin-content" id="about-admin">
          <h3>關於我哋 — 四項內容</h3>
          <p class="admin-lead">每行一個重點，前台會以項目符號（•）顯示。</p>
          <form id="about-form" class="admin-form admin-about-form">
            <label>
              <span class="about-label">🎓 專業師資</span>
              <textarea name="aboutTeachers" id="about-teachers" rows="4" placeholder="例：&#10;擁有多年教學經驗&#10;熟悉 DSE 考試重點"></textarea>
            </label>
            <label>
              <span class="about-label">📚 小班教學</span>
              <textarea name="aboutSmallClass" id="about-small-class" rows="4" placeholder="例：&#10;每班最多 8 人&#10;個別指導"></textarea>
            </label>
            <label>
              <span class="about-label">📈 成績保證</span>
              <textarea name="aboutResults" id="about-results" rows="4" placeholder="例：&#10;成績進步率超過 90%"></textarea>
            </label>
            <label>
              <span class="about-label">☁️ 雲端教材</span>
              <textarea name="aboutCloud" id="about-cloud" rows="4" placeholder="例：&#10;筆記上載雲端&#10;錄影重溫溫習"></textarea>
            </label>
            <div class="admin-form-actions">
              <button type="submit" class="cta">儲存並上載</button>
              <a href="/tutor.html#about" class="cta cta-secondary">預覽網站</a>
            </div>
            <p class="admin-status" id="about-status" role="status" aria-live="polite"></p>
          </form>
        </div>

        <div class="admin-content" id="courses-admin" hidden>
          <h3>新增 / 編輯課程</h3>
          <form id="course-form" class="admin-form">
            <input type="hidden" name="id" id="course-id" />
            <label>課程名稱 <input type="text" name="name" id="course-name" required /></label>
            <label>對象 <input type="text" name="target" id="course-target" placeholder="例：中一至中三" /></label>
            <label>時間 <input type="text" name="schedule" id="course-schedule" placeholder="例：逢星期六 10:00-12:00" /></label>
            <label>學費 <input type="text" name="fee" id="course-fee" placeholder="例：$800/月" /></label>
            <label>簡介 <textarea name="description" id="course-desc" rows="3"></textarea></label>
            <div class="admin-form-actions">
              <button type="submit" class="cta">儲存課程</button>
              <button type="button" class="cta cta-secondary" id="course-reset">清除</button>
            </div>
          </form>
          <div id="courses-admin-list"></div>
        </div>

        <div class="admin-content" id="announce-admin" hidden>
          <h3>新增公告</h3>
          <form id="announce-form" class="admin-form">
            <input type="hidden" name="id" id="announce-id" />
            <label>標題 <input type="text" name="title" id="announce-title" required /></label>
            <label>內容 <textarea name="content" id="announce-content" rows="4" required></textarea></label>
            <div class="admin-form-actions">
              <button type="submit" class="cta">發佈公告</button>
              <button type="button" class="cta cta-secondary" id="announce-reset">清除</button>
            </div>
          </form>
          <div id="announce-admin-list"></div>
        </div>

        <div class="admin-content" id="info-admin" hidden>
          <h3>補習社基本資料</h3>
          <form id="info-form" class="admin-form">
            <label>補習社名稱 <input type="text" name="name" id="info-name" /></label>
            <label>地址 <input type="text" name="address" id="info-address" /></label>
            <label>電話 <input type="text" name="phone" id="info-phone" /></label>
            <label>電郵 <input type="email" name="email" id="info-email" /></label>
            <label>辦公時間 <input type="text" name="hours" id="info-hours" placeholder="例：星期一至六 14:00-21:00" /></label>
            <label>WhatsApp 連結 <input type="url" name="whatsapp" id="info-whatsapp" placeholder="https://wa.me/852..." /></label>
            <div class="admin-form-actions">
              <button type="submit" class="cta">儲存資料</button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p><a href="/tutor.html">← 返回補習社網站</a></p>
    </footer>

    <script src="/tutor.js"></script>
  </body>
</html>
